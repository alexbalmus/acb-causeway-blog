#
# Recommend use for static configuration that does not change between environments.
#
# See also config/application.properties
#
causeway:
  security:
    spring:
      allow-csrf-filters: true

  applib:
    annotation:
      action:
        explicit: true
      action-layout:
        css-class:
          patterns:
            delete.*:btn-danger,
            discard.*:btn-warning,
            remove.*:btn-warning

  core:
    meta-model:
      introspector:
        lock-after-full-introspection: true
        mode: full
      validator:
        allow-deprecated: false

  viewer:
    common:
      application:
        about: ACB Blog
        # no brand logos: render the application name as the brand instead
        favicon-url: images/favicon.png
        menubars-layout-file: menubars.layout.xml
        name: ACB Blog
        # https://stackoverflow.com/a/38983935/56880
        version: ^project.version^
      credit:
        - url:  https://causeway.apache.org
          image: images/apache-causeway/logo-65x48.png
          name: Apache Causeway
    wicket:
      css: css/application.css
      js: scripts/application.js
      bookmarked-pages:
        show-chooser: true
        show-drop-down-on-footer: true

      max-title-length-in-standalone-tables: 0
      max-title-length-in-parented-tables: 0

      themes:
        initial: Litera
        show-chooser: true
    graphql:
      api-variant: query_with_mutations_non_spec_compliant
    restfulobjects:
      authentication:
        strategy-class-name: com.alexbalmus.acbblog.webapp.security.RestSessionAuthenticationStrategy
      # Preserve the Restful Objects endpoint consumed by the Angular client.
      base-path: /restful


eclipselink:
  # if enabled, then must be run with JVM arg:
  # -javaagent:lib/spring-instrument-5.3.8.jar
  weaving: false
  # if weaving subproperties are required, then specify all eclipselink.weaving
  # properties using application.properties instead (it's not possible to
  # specify both eclipselink.weaving property and its subproperties using yaml syntax)

server:
  # Override the bind address and enable secure cookies when deploying behind HTTPS.
  address: 127.0.0.1
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${ACB_SECURE_COOKIES:false}
  max-http-header-size: 16KB

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  banner:
    location: banner.txt
  graphql:
    graphiql:
      enabled: false
      path: "/graphiql"
    schema:
      printer:
        enabled: false

acb:
  blog:
    max-image-bytes: 5242880
    max-image-pixels: 20000000
  security:
    secure-cookies: ${ACB_SECURE_COOKIES:false}

management:
  endpoint:
    health:
      enabled: true

gg:
  jte:
    use-precompiled-templates: true

