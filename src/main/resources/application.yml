#
# Recommend use for static configuration that does not change between environments.
#
# See also config/application.properties
#
causeway:

  applib:
    annotation:
      action:
        explicit: true
      action-layout:
        css-class:
          patterns:
            delete.*:btn-danger,
            discard.*:btn-warning,
            remove.*:btn-warning

  core:
    meta-model:
      introspector:
        lock-after-full-introspection: true
        mode: full
      validator:
        allow-deprecated: false

  viewer:
    common:
      application:
        about: ACB Blog
        # no brand logos: render the application name as the brand instead
        favicon-url: images/favicon.png
        menubars-layout-file: menubars.layout.xml
        name: ACB Blog
        # https://stackoverflow.com/a/38983935/56880
        version: ^project.version^
      credit:
        - url:  https://causeway.apache.org
          image: images/apache-causeway/logo-65x48.png
          name: Apache Causeway
    wicket:
      css: css/application.css
      js: scripts/application.js
      bookmarked-pages:
        show-chooser: true
        show-drop-down-on-footer: true

      max-title-length-in-standalone-tables: 0
      max-title-length-in-parented-tables: 0

      themes:
        initial: Litera
        show-chooser: true
    graphql:
      api-variant: query_with_mutations_non_spec_compliant
      authentication:
        fallback:
          username: sven
          roles:
            - simple-superuser
            - foo
            - bar
    restfulobjects:
      # Preserve the Restful Objects endpoint consumed by the Angular client.
      base-path: /restful


eclipselink:
  # if enabled, then must be run with JVM arg:
  # -javaagent:lib/spring-instrument-5.3.8.jar
  weaving: false
  # if weaving subproperties are required, then specify all eclipselink.weaving
  # properties using application.properties instead (it's not possible to
  # specify both eclipselink.weaving property and its subproperties using yaml syntax)

server:
  # Bind to loopback only so the app is reachable just from this machine.
  # This POC has prototyping mode (H2 console), a GraphQL superuser fallback and
  # shared demo passwords enabled, none of which should be exposed on a network.
  # For a genuine multi-host deployment, override this (e.g. server.address=0.0.0.0)
  # only once those are secured.
  address: 127.0.0.1
  max-http-header-size: 16KB

spring:
  banner:
    location: banner.txt
  graphql:
    graphiql:
      enabled: true
      path: "/graphiql"
    schema:
      printer:
        enabled: true

management:
  endpoint:
    health:
      enabled: true

