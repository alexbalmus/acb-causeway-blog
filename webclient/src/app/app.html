<nav class="navbar navbar-expand bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">&#9993; ACB Blog</a>
    @if (auth.userName(); as user) {
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text">&#128100; {{ user }}</span>
        <button class="btn btn-sm btn-outline-light" (click)="logout()">Sign out</button>
      </div>
    }
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>

<div class="toast-stack" aria-live="polite" aria-atomic="true">
  @for (toast of messages.toasts(); track toast.id) {
    <div
      class="toast show align-items-center border-0 text-bg-{{ toast.kind === 'error' ? 'danger' : 'success' }}"
      role="alert"
    >
      <div class="d-flex">
        <div class="toast-body">{{ toast.text }}</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Close"
          (click)="messages.dismiss(toast.id)"
        ></button>
      </div>
    </div>
  }
</div>
